name: Build Windows beta installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/beta-release.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-beta:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify beta version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') {
            throw "Expected a beta version in package.json, found: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The repository intentionally does not commit Windows executables. Fetch
      # winws.exe from the matching official Flowseal release before packaging.
      - name: Include verified winws.exe from Flowseal
        shell: pwsh
        run: |
          $version = "1.10.4"
          $archiveName = "zapret-discord-youtube-$version.zip"
          $url = "https://github.com/Flowseal/zapret-discord-youtube/releases/download/$version/$archiveName"
          $expected = "291af673bd0238506f9548e0e94ca0abf244000f4c9a06960544fb01c5f97b34"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $unpacked = Join-Path $env:RUNNER_TEMP "flowseal-zapret"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Official Flowseal archive checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          $binary = Get-ChildItem -Path $unpacked -Recurse -Filter "winws.exe" -File | Select-Object -First 1
          if (-not $binary) { throw "winws.exe not found in official Flowseal archive" }
          New-Item -ItemType Directory -Force -Path "zapret/bin" | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination "zapret/bin/winws.exe" -Force
          if ((Get-Item "zapret/bin/winws.exe").Length -lt 100000) {
            throw "winws.exe looks incomplete"
          }

      - name: Build Windows NSIS installer
        run: npm run build -- --win nsis --publish never

      - name: Verify installer and generate checksum
        shell: pwsh
        env:
          BETA_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $installer = "dist/Zapret-Control-Center-Setup-$env:BETA_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer not found: $installer"
          }
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $filename = Split-Path -Leaf $installer
          "$checksum  $filename" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Publish prerelease (does not replace stable latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $tag = "v$env:BETA_VERSION"
          $installer = "dist/Zapret-Control-Center-Setup-$env:BETA_VERSION.exe"
          gh release create $tag $installer "dist/SHA256SUMS.txt" `
            --prerelease `
            --latest=false `
            --target "$env:GITHUB_SHA" `
            --title "Zapret Control Center $env:BETA_VERSION (Beta)" `
            --notes "Beta UI correction: the power button now occupies the upper center as in the user's layout reference; protection status and service indicators sit together in the lower middle column between the configuration and quick logs. Removes the overly tight status caption under the power button, with responsive narrow-window fallback. Retains TG WS Proxy Telegram connection, verified updates, and the previous themed status animations."
